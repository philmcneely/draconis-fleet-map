    --ink:#d9e3e9; --mut:#7e8f9a; --dim:#526270;
    --ok:#3fb950; --warn:#d29922; --hot:#e5484d;
    --vllm:#7b8cff; --ollama:#4fd0c8; --svc:#c98bdb; --llama:#f0a868; --cloud:#f0a868;

    --accent:#e5484d;

  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.4;padding:clamp(14px,2.6vw,36px);

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.4px}
  .topbar .sub{font-family:var(--mono);font-size:12px;color:var(--mut)}
  .crumb{font-family:var(--mono);font-size:12.5px;color:var(--mut)}
  .crumb button{font:inherit;color:var(--ink);background:none;border:none;cursor:pointer;padding:0;border-bottom:1px dotted var(--rail2)}

  .back{margin-left:auto}

  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--rail);flex-wrap:wrap}
  .tab{font:inherit;font-size:13px;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px 10px;cursor:pointer;letter-spacing:.3px}

  @media(max-width:760px){.agg{grid-template-columns:repeat(2,1fr)}}
  .stat{border:1px solid var(--rail);border-radius:11px;background:linear-gradient(180deg,var(--bg2),var(--bg));padding:15px 16px}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim)}
  .stat .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--mut);font-weight:400}
  .stat.free .v{color:var(--ok)}
  .stat .note{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:5px}

  .mbhead:focus-visible{outline:2px solid var(--mc);outline-offset:-2px}

  .mbhead .nm{font-size:16px;font-weight:700;letter-spacing:.3px}
  .mbhead .hw{font-family:var(--mono);font-size:11px;color:var(--mut)}

  .mrole b{color:var(--ink);font-weight:600}

  .be.cloud{color:var(--cloud);background:#f0a86818;border:1px solid #f0a86840}
  .be.chain{color:var(--svc);background:#c98bdb18;border:1px solid #c98bdb40}
  .be.llama{color:var(--llama);background:#f0a86818;border:1px solid #f0a86840}

  .pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--rail2);color:var(--mut)}

  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .ccard{border:1px solid var(--rail);border-left:3px solid var(--cloud);border-radius:11px;background:var(--card);padding:15px 17px}

  .ccard .ct{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .ccard .cn{font-size:15px;font-weight:700}
  .status{margin-left:auto;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:99px}
  .status.on{color:var(--ok);border:1px solid #3fb95055;background:#3fb9500f}
  .status.no{color:var(--dim);border:1px solid var(--rail2)}
  .ccard .use{font-size:12px;color:var(--mut);margin:2px 0 10px}
  .ccard .ml{font-family:var(--mono);font-size:11px;color:var(--ink);display:flex;flex-wrap:wrap;gap:5px}
  .ccard .ml span{background:#0c1013;border:1px solid var(--rail2);border-radius:5px;padding:1.5px 7px;color:var(--mut)}
  .acard{border:1px solid var(--rail);border-left:3px solid var(--vllm);border-radius:11px;background:var(--card);padding:15px 17px}
  .acard .an{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
  .acard .ah{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
  .acard .ar{font-size:12px;color:var(--mut);margin:3px 0 9px}
  .acard .pts{font-family:var(--mono);font-size:11.5px;color:var(--ink);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .acard .pts .k{color:var(--dim);flex:none}
  .acard .pts b{color:var(--llama);font-weight:600}

  .legend{margin-top:16px;border:1px solid var(--rail);border-radius:11px;background:#0f151a;padding:14px 18px}
  .legend .row{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:11.5px;color:var(--mut)}
  .legend .item{display:flex;align-items:center;gap:7px} .sw{width:20px;height:8px;border-radius:99px}
  .swbox{width:16px;height:12px;border-radius:3px;border:1px dashed var(--warn)}
  .foot{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:18px;text-align:center}
  .hide{display:none}
</style>

const fillClass = p => p>85?'fill-hot':p>40?'fill-warn':'fill-ok';
const fillColor = p => p>85?'#e5484d':p>40?'#d29922':'#3fb950';
const gpuUsedTotal = m => m.gpus.reduce((a,g)=>a+(g.used||0),0);
function machineFree(m){
  let freeCards=0, freeVram=0;
  m.gpus.forEach(g=>{
    if(g.burst||g.warncard||g.committed) return;
    const hasModel=(g.chips&&g.chips.length)||(m.spans||[]).some(s=>s.members.includes(g.idx));
    if(!hasModel){ freeCards++; freeVram+=g.total; }
  });
  return {freeCards, freeVram};
}
function unitsHTML(m){
  const claimed=new Set(),units=[];
  (m.spans||[]).forEach(s=>{ s.members.forEach(i=>claimed.add(i)); const mem=s.members.map(i=>m.gpus[i]);
    const data=Object.entries(s.data||{}).map(([k,v])=>`${k} ${v}`).join(' · ');
    units.push(`<div class="unit span"><div class="spanhead"><span>${esc(s.name)}</span><span class="b">${esc(s.type)} · spans ${s.members.length} GPUs</span><span class="data">${esc(data)}</span></div>
      <div class="bridge">╱╲</div><div class="spanmembers">${mem.map(g=>gpuCardHTML(g,m)).join('')}</div></div>`); });
  m.gpus.forEach(g=>{ if(!claimed.has(g.idx)) units.push(`<div class="unit">${gpuCardHTML(g,m)}</div>`); });
  return units.join('');
}

/* ---- overview: every machine drawn as its real GPU grid ---- */
function renderOverview(){
  let totVram=0,totUsed=0,totFree=0,totFreeCards=0,totModels=0;
  FLEET.forEach(m=>{ totVram+=m.total; totUsed+=gpuUsedTotal(m); const f=machineFree(m); totFree+=f.freeVram; totFreeCards+=f.freeCards;
    (m.spans||[]).forEach(()=>totModels++); m.gpus.forEach(g=>totModels+=(g.chips?g.chips.length:0)); });
  const cardCount=FLEET.reduce((a,m)=>a+m.gpus.length,0);
  const agg=`<div class="agg">
    <div class="stat"><div class="k">Fleet VRAM</div><div class="v">${totVram}<small> GB</small></div><div class="note">${FLEET.length} GPU boxes · ${cardCount} cards</div></div>
    <div class="stat"><div class="k">Committed</div><div class="v">${Math.round(totUsed)}<small> GB</small></div><div class="note">${totModels} models · weights + context</div></div>
    <div class="stat free"><div class="k">Deployable free</div><div class="v">${totFreeCards}<small> cards</small></div><div class="note">${totFreeCards===0?'fully committed right now':Math.round(totFree)+' GB on empty cards'}</div></div>
    <div class="stat"><div class="k">Reserved on-demand</div><div class="v">3<small> +1</small></div><div class="note">VibeVoice burst ×3 · 1 card recovering</div></div>
  </div>`;
  const blocks=FLEET.map(m=>{
    const used=gpuUsedTotal(m),f=machineFree(m);
    return `<div class="mblock" style="--mc:${m.mc}">
      <div class="mbhead" data-id="${m.id}" role="button" tabindex="0">
        <span class="dot"></span><span class="nm">${m.name}</span><span class="hw">${esc(m.hw)}</span>
        <span class="mbstats">vram <b>${Math.round(used)}</b>/${m.total} GB · <span class="fr">${f.freeCards} free card${f.freeCards===1?'':'s'}</span></span>
        <span class="zoom">details ↗</span>
      </div>
      <div class="units">${unitsHTML(m)}</div>
    </div>`;
  }).join('');
  document.getElementById('overview').innerHTML=agg+`<p class="section-label">Machines · click a machine header to zoom into its full page</p>${blocks}`;
}

/* ---- machine detail ---- */
function chipHTML(c){
  const data=Object.entries(c.data||{}).map(([k,v])=>`<span><span class="k">${esc(k)}</span> <b>${esc(v)}</b></span>`).join('');
  return `<div class="chip ${c.type||''}"><div class="cname">${esc(c.name)} ${c.b?`<span class="b">${esc(c.b)}</span>`:''}${c.ab?`<span class="b ab">abliterated</span>`:''}</div><div class="data">${data}</div></div>`;
}
function gpuCardHTML(g,m){
  const p=Math.min(100,Math.round(100*(g.used||0)/g.total));
  const hasModel=g.chips&&g.chips.length;
  let cls='gpu';if(g.warncard)cls+=' warncard';else if(g.burst)cls+=' burst';else if(!hasModel)cls+=' idle';
  let inner;
  if(g.burst)inner=`<div class="burstlabel">◇ ${esc(g.burst)} burst pool<small>pinned · loads on demand · not free</small></div>`;
  else if(hasModel)inner=`<div class="chips">${g.chips.map(chipHTML).join('')}</div>`;
  else inner=`<div class="free">— free —</div>`;
  return `<div class="${cls}">
    <div class="ghead"><span class="gidx">GPU ${g.idx}</span><span class="gname">${esc(g.name)}</span><span class="gvram">${g.used||0}/${g.total} GB · ${p}%</span></div>
    <div class="bar"><span class="${fillClass(p)}" style="width:${Math.max(2,p)}%"></span></div>
    ${g.note?`<div style="font-family:var(--mono);font-size:10px;color:var(--mut)">${esc(g.note)}</div>`:''}${inner}</div>`;
}
function renderDetail(m){
  document.documentElement.style.setProperty('--accent',m.mc);
  const used=gpuUsedTotal(m),f=machineFree(m);
  const activeCards=m.gpus.filter(g=>(g.chips&&g.chips.length)||(m.spans||[]).some(s=>s.members.includes(g.idx))).length;
  const proxies=m.proxies.map(p=>`<div class="prox"><div class="top"><span class="pname">${esc(p.name)}</span><span class="port">${esc(p.port)}</span></div>
    <div class="route"><span class="be ${p.be}">${esc(p.be)}</span><span class="arrow">→</span> ${esc(p.route)}</div>
    <div class="flags">${(p.flags||[]).map(fl=>`<span class="pill">${esc(fl)}</span>`).join('')}</div></div>`).join('');
  document.getElementById('detail').innerHTML=`<div class="chassis">
    <div class="mhead"><div class="eye"></div>
      <div><h2 class="mname">${m.name}</h2><div class="msub">${esc(m.hw)} · ${m.vendor}</div></div>
      <div class="mrole"><span class="tag">${esc(m.role)}</span>
        <div class="totals">VRAM <b>${Math.round(used)} / ${m.total} GB</b> · deployable <b style="color:var(--ok)">${f.freeCards} card${f.freeCards===1?'':'s'}</b> · active <b>${activeCards}/${m.gpus.length}</b></div></div></div>
    ${m.specs?`<div class="specbar"><p class="section-label">Machine</p>
      <div class="specs">
        <div class="sp"><span class="sk">Chassis</span><span class="sv">${esc(m.specs.chassis)}</span></div>
        <div class="sp"><span class="sk">CPU</span><span class="sv">${esc(m.specs.cpu)}</span></div>
        <div class="sp"><span class="sk">Memory</span><span class="sv">${esc(m.specs.mem)}</span></div>
        <div class="sp"><span class="sk">OS</span><span class="sv">${esc(m.specs.os)}</span></div>
      </div>
      ${m.desc?`<p class="mdesc">${esc(m.desc)}</p>`:''}</div>`:''}
    <div class="proxbar"><p class="section-label">Fronting proxies</p><div class="proxies">${proxies}</div></div>
    <div class="gpubar"><p class="section-label">GPUs · model residency</p><div class="units">${unitsHTML(m)}</div>
      <div class="legend"><div class="row">
        <span class="item"><span class="sw fill-ok"></span> &lt;40%</span>
        <span class="item"><span class="sw fill-warn"></span> 40–85%</span>
        <span class="item"><span class="sw fill-hot"></span> &gt;85%</span>
        <span class="item"><span class="swbox"></span> load-on-demand (not free)</span>
        <span class="item"><span class="sw" style="background:var(--llama)"></span> spanning model bridges its cards</span>
      </div></div></div></div>`;
}

/* ---- nav ---- */
let curView='compute';
function showMachine(id){
  const m=FLEET.find(x=>x.id===id); if(!m)return;
  renderDetail(m);
  document.getElementById('overview').classList.add('hide');
  document.getElementById('detail').classList.remove('hide');
  document.getElementById('backwrap').classList.remove('hide');
  document.getElementById('crumbTitle').textContent=m.name;
  document.getElementById('crumbSub').textContent=esc(m.hw);
  window.scrollTo({top:0});
}
function backToOverview(){
  document.getElementById('overview').classList.remove('hide');
  document.getElementById('detail').classList.add('hide');
  document.getElementById('backwrap').classList.add('hide');
  document.documentElement.style.setProperty('--accent','#e5484d');
  document.getElementById('crumbTitle').textContent='Fleet LLM Map';
  document.getElementById('crumbSub').textContent='compute · cloud · agents';
}
function switchView(v){
  curView=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  ['compute','cloud','agents'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hide',x!==v));
  document.getElementById('backwrap').classList.add('hide');
  if(v==='compute'){ backToOverview(); }
  else { document.documentElement.style.setProperty('--accent','#e5484d');
    document.getElementById('crumbTitle').textContent = v==='cloud'?'Cloud subscriptions':'Agents';
    document.getElementById('crumbSub').textContent = v==='cloud'?'metered fallbacks & specialty models':'who points at what';
  }
  window.scrollTo({top:0});
}
renderOverview(); renderCloud(); renderAgents();
document.getElementById('overview').addEventListener('click',e=>{const c=e.target.closest('.mbhead');if(c)showMachine(c.dataset.id);});
document.getElementById('overview').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('mbhead')){e.preventDefault();showMachine(e.target.dataset.id);}});
document.getElementById('backbtn').addEventListener('click',backToOverview);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
</script>
