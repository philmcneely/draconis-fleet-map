<!doctype html><html lang="en" data-look="rack"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet LLM Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<script>
/* pick the look before first paint: ?look= wins, then the saved choice, then rack */
(function(){var l=null;try{l=new URLSearchParams(location.search).get('look')||localStorage.getItem('fleetmap-look')}catch(e){}
if(l==='rack'||l==='ledger')document.documentElement.dataset.look=l;})();
</script>
<style>
  /* palette shared with philmcneely.github.io/systems (warm ink + paper), status colours kept */
  :root{
    --ink:#17140f; --ink2:#1d1913; --line:#3a3227; --line2:#5a4f3e;
    --paper:#ece4d5; --dim:#b3a892; --faint:#857a65;
    --ox:#c05545;
    --hot:#e0574a; --warn:#d9a23a; --ok:#6fb26f; --svc:#a68ad8; --cyan:#46b5c8;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --cond:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
    --grot:'Archivo','Arial Narrow',sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink);color:var(--paper);font:15px/1.45 var(--cond);-webkit-font-smoothing:antialiased;padding:clamp(16px,3vw,40px) clamp(16px,3vw,40px) 48px}
  [data-look="rack"] body{background-image:linear-gradient(#ece4d50a 1px,transparent 1px),linear-gradient(90deg,#ece4d50a 1px,transparent 1px);background-size:24px 24px}
  [data-look="ledger"] body{font-family:var(--grot)}
  .wrap{max-width:1240px;margin:0 auto}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ox);outline-offset:2px}
  .hide{display:none!important}
  .k{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
  .mono{font-family:var(--mono)}

  /* ---------- masthead ---------- */
  .mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px 28px;padding-bottom:16px}
  .kick{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ox)}
  .mast h1{margin:8px 0 0;line-height:.95}
  .mast .sub{font:12.5px var(--mono);color:var(--dim);margin-top:10px}
  .lookctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .look{display:flex;border:1.5px solid var(--line2)}
  .look button{background:none;border:0;padding:7px 16px;cursor:pointer;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .look button+button{border-left:1.5px solid var(--line2)}
  .look button[aria-checked="true"]{background:var(--paper);color:var(--ink)}
  .look button:hover{color:var(--paper)} .look button[aria-checked="true"]:hover{color:var(--ink)}
  [data-look="rack"] .mast{border:1.5px solid var(--line2);border-bottom:0;padding:22px 24px 18px;background:#17140fd9}
  [data-look="rack"] .mast h1{font:700 44px/1 var(--cond);letter-spacing:-.01em}
  [data-look="ledger"] .mast{border-bottom:6px solid var(--paper)}
  [data-look="ledger"] .mast h1{font-family:var(--grot);font-stretch:68%;font-weight:900;font-size:clamp(56px,8.4vw,118px);letter-spacing:-.03em;text-transform:uppercase;line-height:.86}

  /* ---------- tabs ---------- */
  .tabs{display:flex;flex-wrap:wrap;align-items:stretch;margin-bottom:26px}
  .tab,.backbtn{background:none;cursor:pointer;padding:9px 16px;font:500 12.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  .tab:hover,.backbtn:hover{color:var(--paper)}
  .tab[aria-selected="true"]{color:var(--paper)}
  .backbtn{margin-left:auto}
  [data-look="rack"] .tabs{border:1.5px solid var(--line2)}
  [data-look="rack"] .tab{border:0;border-right:1.5px solid var(--line2)}
  [data-look="rack"] .tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
  [data-look="rack"] .backbtn{border:0;border-left:1.5px solid var(--line2)}
  [data-look="ledger"] .tabs{gap:2px;margin-top:14px}
  [data-look="ledger"] .tab,[data-look="ledger"] .backbtn{border:2px solid var(--paper)}
  [data-look="ledger"] .tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}

  /* ---------- totals ---------- */
  .totals{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:30px}
  .tot b{display:block;font-variant-numeric:tabular-nums}
  .tot .note{font:11.5px var(--mono);color:var(--dim);margin-top:4px}
  .tot.zero b{color:var(--hot)}
  [data-look="rack"] .totals{border:1.5px solid var(--line2);margin-top:-27px}
  [data-look="rack"] .tot{padding:12px 16px;border-right:1px solid var(--line2)}
  [data-look="rack"] .tot:last-child{border-right:0}
  [data-look="rack"] .tot b{font:600 28px/1.1 var(--cond);margin-top:4px}
  [data-look="rack"] .tot b small{font-size:15px;font-weight:500;color:var(--dim)}
  [data-look="ledger"] .totals{border-bottom:2px solid var(--paper);margin-top:-26px}
  [data-look="ledger"] .tot{padding:20px 20px 16px 0;border-right:1px solid var(--line2)}
  [data-look="ledger"] .tot+.tot{padding-left:20px}
  [data-look="ledger"] .tot:last-child{border-right:0}
  [data-look="ledger"] .tot b{font-family:var(--grot);font-stretch:68%;font-weight:800;font-size:clamp(52px,6vw,80px);line-height:.9;letter-spacing:-.03em}
  [data-look="ledger"] .tot b small{font-size:24px;font-weight:600;letter-spacing:0;margin-left:3px}
  [data-look="ledger"] .tot .k{display:none}
  .section-label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:0 0 14px}

  /* ---------- status swatches ---------- */
  .sq{display:inline-block;width:13px;height:13px;flex:none;vertical-align:-1px}
  .s-hot{background:var(--hot)} .s-warn{background:var(--warn)} .s-ok{background:var(--ok)} .s-svc{background:var(--svc)}
  .s-held{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--warn) 3px 5px);outline:1px solid var(--warn);outline-offset:-1px}
  .s-idle{outline:1px dashed var(--faint);outline-offset:-1px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 22px;font:11.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:6px 0 28px}
  .legend span{display:flex;align-items:center;gap:7px}

  /* ========== RACK look: each machine drawn as a chassis with its GPU bays ========== */
  .rk{display:grid;grid-template-columns:190px 1fr;margin-bottom:10px}
  .rk-tag{border:1.5px solid var(--line2);border-right:0;padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:#17140fe6;cursor:pointer;text-align:left}
  .rk-tag:hover{background:#221d16}
  .rk-tag h2{margin:0;font:700 25px/1 var(--cond);display:flex;align-items:center;gap:9px}
  .lamp{width:10px;height:10px;border-radius:50%;background:var(--mc);flex:none}
  .rk-tag .hw{font:11px/1.6 var(--mono);text-transform:uppercase;color:var(--dim);margin-top:8px}
  .rk-tag .use{font:12px var(--mono);color:var(--dim)} .rk-tag .use b{color:var(--paper);font-weight:600}
  .rk-tag .open{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mc)}
  .rk-chassis{border:1.5px solid var(--line2);position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:#17140fe6}
  .rk-chassis::after{content:"";position:absolute;top:10px;bottom:10px;right:-12px;width:7px;border:1px solid var(--line2);background:repeating-linear-gradient(0deg,transparent 0 6px,var(--line2) 6px 7px)}
  .bay{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);margin:0 -1px -1px 0;padding:10px 11px 12px;display:grid;grid-template-rows:auto 90px auto;align-content:start;gap:8px;min-width:0}
  .bay .id{display:flex;justify-content:space-between;gap:6px;font:11px var(--mono);text-transform:uppercase;color:var(--dim)}
  .bay .id b{color:var(--paper);font-weight:500}
  .gauge{border:1.5px solid var(--line2);position:relative;background:repeating-linear-gradient(90deg,transparent 0 9px,#ece4d50d 9px 10px)}
  .gauge .fill{position:absolute;left:0;right:0;bottom:0}
  .gauge .pct{position:absolute;right:5px;top:4px;font:500 11.5px var(--mono);background:var(--ink);padding:0 4px}
  .bay.held .gauge{border-style:dashed;border-color:var(--warn);background:repeating-linear-gradient(135deg,transparent 0 6px,#d9a23a40 6px 8px)}
  .bay.idle .gauge{border-style:dashed}
  .bay .models{display:flex;flex-direction:column;gap:6px;min-width:0}
  .bay .mdl{font-weight:600;font-size:14.5px;line-height:1.15;overflow-wrap:anywhere}
  .bay .mdl small{display:block;font:10.5px/1.4 var(--mono);font-weight:400;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .bay .mdl .ab{color:var(--svc)}
  .bay .data{font:11px/1.5 var(--mono);color:var(--dim);margin-top:3px}
  .bay .data b{color:var(--paper);font-weight:500}
  .bay .note{font:10.5px/1.4 var(--mono);color:var(--faint)}
  .dim{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--faint);margin:6px 0 26px 190px}
  .dim::before,.dim::after{content:"";flex:1;border-top:1px solid var(--line2)}

  /* ========== LEDGER look: big numerals + hard-ruled tables ========== */
  .lg{display:grid;grid-template-columns:270px 1fr;gap:0 24px;border-bottom:2px solid var(--paper);padding:26px 0 24px}
  .lg-head{text-align:left;background:none;border:0;padding:0;cursor:pointer;align-self:start}
  .lg-head h2{margin:0;font-family:var(--grot);font-stretch:68%;font-weight:900;font-size:46px;line-height:.9;text-transform:uppercase;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .lg-head h2 .lamp{width:12px;height:12px}
  .lg-head .hw{font:11.5px/1.7 var(--mono);text-transform:uppercase;color:var(--dim);margin-top:10px}
  .lg-head .use{margin-top:14px;font-family:var(--grot);font-stretch:68%;font-weight:700;font-size:32px}
  .lg-head .use small{font-size:14px;font-weight:500;color:var(--dim)}
  .lg-head .open{display:inline-block;margin-top:12px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--mc);color:var(--paper)}
  .lg-head:hover .open{color:var(--mc)}
  table.rows{width:100%;border-collapse:collapse;font-size:15px}
  table.rows th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;text-align:left;color:var(--faint);border-bottom:2px solid var(--paper);padding:0 10px 6px 0}
  table.rows td{border-bottom:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top}
  table.rows td.n{font:500 13px var(--mono);width:36px;padding-top:11px}
  table.rows td.st{width:26px;padding-top:12px}
  table.rows td.m b{font-weight:700}
  table.rows td.m small{font:11.5px var(--mono);color:var(--dim);margin-left:8px}
  table.rows td.m .ab{color:var(--svc)}
  table.rows td.m .data{font:11px/1.5 var(--mono);color:var(--dim);margin-top:4px}
  table.rows td.m .data b{color:var(--paper);font-weight:500}
  table.rows td.m .note{font:11px var(--mono);color:var(--faint);margin-top:3px}
  table.rows td.bar{width:min(240px,26%);padding-top:14px}
  .track{height:10px;border:1.5px solid var(--paper);position:relative}
  .track i{position:absolute;inset:0 auto 0 0;background:var(--paper)}
  tr.held .track{border-style:dashed;border-color:var(--warn)}
  tr.held td.m b{font-weight:500;font-style:italic}
  table.rows td.v{font:500 13px var(--mono);width:110px;text-align:right;padding-top:11px;white-space:nowrap}

  /* ---------- machine sheet (detail) ---------- */
  .sheet-head{display:grid;grid-template-columns:1fr auto;gap:10px 30px;align-items:end;padding-bottom:16px}
  .sheet-head h2{margin:0;display:flex;align-items:center;gap:12px}
  .sheet-head .hw{font:12.5px var(--mono);color:var(--dim);margin-top:8px}
  .sheet-head .role{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mc);text-align:right}
  .sheet-head .tl{font:12.5px var(--mono);color:var(--dim);margin-top:6px;text-align:right}
  .sheet-head .tl b{color:var(--paper);font-weight:600}
  dl.specs{display:grid;grid-template-columns:repeat(4,1fr);margin:0}
  dl.specs div{padding:10px 14px 10px 0}
  dl.specs dt{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  dl.specs dd{margin:4px 0 0;font-size:14.5px}
  .desc{max-width:78ch;color:var(--dim);font-size:15px;line-height:1.6;margin:16px 0 6px}
  .docs{font:12.5px var(--mono);margin:8px 0 0}
  .docs a{color:var(--paper);border-bottom:1px solid var(--mc);text-decoration:none}
  .docs a:hover{color:var(--mc)}
  .block{margin-top:30px}
  table.plain{width:100%;border-collapse:collapse}
  table.plain th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;text-align:left;color:var(--faint);padding:0 12px 7px 0;border-bottom:1.5px solid var(--line2)}
  table.plain td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  table.plain td.mono{font-size:12.5px;color:var(--dim)}
  table.plain b{font-weight:600}
  .be{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .be-vllm{color:var(--cyan)} .be-ollama{color:var(--ok)} .be-cloud,.be-llama,.be-llama\.cpp{color:var(--warn)} .be-chain{color:var(--svc)}
  .flag{display:inline-block;font:10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);padding:0 6px;margin:4px 4px 0 0}
  [data-look="rack"] .sheet{border:1.5px solid var(--line2);background:#17140fe6;padding:22px 24px 26px}
  [data-look="rack"] .sheet-head{border-bottom:1.5px solid var(--line2)}
  [data-look="rack"] .sheet-head h2{font:700 38px/1 var(--cond)}
  [data-look="rack"] dl.specs{border-bottom:1px solid var(--line2)}
  [data-look="rack"] dl.specs div+div{border-left:1px solid var(--line2);padding-left:14px}
  [data-look="ledger"] .sheet-head{border-bottom:2px solid var(--paper)}
  [data-look="ledger"] .sheet-head h2{font-family:var(--grot);font-stretch:68%;font-weight:900;font-size:64px;line-height:.9;text-transform:uppercase;letter-spacing:-.02em}
  [data-look="ledger"] dl.specs{border-bottom:1px solid var(--line2)}
  .sheet .rk{grid-template-columns:1fr}
  .sheet .rk-chassis::after{display:none}
  .sheet .bay{grid-template-rows:auto 70px auto}

  /* ---------- cloud + agents ---------- */
  .on{color:var(--ok);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em}
  .off{color:var(--faint);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em}
  tr.inactive td{opacity:.55}
  .mlist{font:12px var(--mono);color:var(--dim)}
  [data-look="rack"] .panel{border:1.5px solid var(--line2);background:#17140fe6;padding:18px 20px}
  .kara{margin-top:30px}
  .kara h3{margin:0;font-size:22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .kara h3 small{font:12px var(--mono);font-weight:400;color:var(--dim)}
  .kara p{color:var(--dim);margin:6px 0 4px}
  [data-look="ledger"] .kara h3{font-family:var(--grot);font-stretch:68%;font-weight:900;font-size:34px;text-transform:uppercase}
  .foot{color:var(--faint);font:11.5px var(--mono);margin-top:32px;text-align:center}

  @media(max-width:860px){
    .mast{grid-template-columns:1fr}.lookctl{align-items:flex-start}
    .totals{grid-template-columns:repeat(2,1fr)}
    [data-look="ledger"] .tot:nth-child(2){border-right:0}
    [data-look="ledger"] .tot:nth-child(3){padding-left:0}
    [data-look="rack"] .tot:nth-child(2){border-right:0}
    [data-look="rack"] .tot:nth-child(-n+2){border-bottom:1px solid var(--line2)}
    .rk{grid-template-columns:1fr}.rk-tag{border-right:1.5px solid var(--line2);border-bottom:0}
    .rk-chassis::after{display:none}.dim{margin-left:0}
    .lg{grid-template-columns:1fr;gap:16px}
    dl.specs{grid-template-columns:repeat(2,1fr)}
    .sheet-head{grid-template-columns:1fr}.sheet-head .role,.sheet-head .tl{text-align:left}
    table.rows td.bar{display:none} table.rows th.bar{display:none}
    .hide-sm{display:none}
    .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .tab,.backbtn{flex:none}
  }
</style></head><body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="kick">Draconis homelab · LLM fleet</div>
      <h1 id="crumbTitle">Fleet LLM Map</h1>
      <div class="sub" id="crumbSub">compute · cloud · agents</div>
    </div>
    <div class="lookctl">
      <span class="k" id="lookLabel">Page style</span>
      <div class="look" role="radiogroup" aria-labelledby="lookLabel">
        <button type="button" role="radio" data-look="rack" aria-checked="true">Rack</button>
        <button type="button" role="radio" data-look="ledger" aria-checked="false">Ledger</button>
      </div>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="compute" aria-selected="true">Compute</button>
    <button class="tab" role="tab" data-view="cloud" aria-selected="false">Cloud subscriptions</button>
    <button class="tab" role="tab" data-view="agents" aria-selected="false">Agents</button>
    <button class="backbtn hide" id="backbtn" type="button">← all machines</button>
  </nav>

  <main>
    <div id="view-compute"><div id="overview"></div><div id="detail" class="hide"></div></div>
    <div id="view-cloud" class="hide"></div>
    <div id="view-agents" class="hide"></div>
  </main>

  <p class="foot">local snapshot 2026-08-28 · self-hosted models on our own hardware + metered cloud fallbacks · click a machine for its full sheet</p>
</div>
<script>
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const FLEET = [
  { id:'hal9000', name:'HAL9000', mc:'#e5484d', hw:'6 × RTX 3090 · 144 GB', vendor:'nvidia',

const pctOf = g => Math.min(100,Math.round(100*(g.used||0)/g.total));
const level = p => p>85?'hot':p>40?'warn':'ok';
const levelColor = {hot:'var(--hot)',warn:'var(--warn)',ok:'var(--ok)'};
const gpuUsedTotal = m => m.gpus.reduce((a,g)=>a+(g.used||0),0);
const fmtGB = n => String(Math.round(n*10)/10);
function machineFree(m){
  let freeCards=0, freeVram=0;
  m.gpus.forEach(g=>{
    if(g.burst||g.warncard||g.committed) return;
    const hasModel=(g.chips&&g.chips.length)||(m.spans||[]).some(s=>s.members.includes(g.idx));
    if(!hasModel){ freeCards++; freeVram+=g.total; }
  });
  return {freeCards, freeVram};
}
/* one status per card: held (burst pool), idle (no model), service (only services), else by fill */
function gpuState(g){
  const hasModel=g.chips&&g.chips.length;
  if(g.burst) return 'held';
  if(!hasModel) return 'idle';
  if(g.chips.every(c=>c.type==='svc')) return 'svc';
  return level(pctOf(g));
}
const dataLine = c => Object.entries(c.data||{}).map(([k,v])=>`${esc(k)} <b>${esc(v)}</b>`).join(' · ');
function modelName(c){ return `${esc(c.name)}${c.ab?' <span class="ab">abliterated</span>':''}`; }

/* ---------- rack look ---------- */
function bayHTML(g,full){
  const p=pctOf(g), st=gpuState(g);
  const fill = st==='held'||st==='idle' ? '' :
    `<div class="fill" style="height:${Math.max(2,p)}%;background:${st==='svc'?'var(--svc)':levelColor[level(p)]}"></div>`;
  const pct = st==='held' ? 'held' : st==='idle' ? 'free' : p+'%';
  let models;
  if(st==='held') models=`<div class="mdl">${esc(g.burst)} burst pool<small>pinned · loads on demand · not free</small></div>`;
  else if(st==='idle') models=`<div class="mdl" style="color:var(--dim)">— free —</div>`;
  else models=g.chips.map(c=>`<div class="mdl">${modelName(c)}${c.b?`<small>${esc(c.b)}</small>`:''}${full&&c.data&&Object.keys(c.data).length?`<div class="data">${dataLine(c)}</div>`:''}</div>`).join('');
  return `<div class="bay ${st}">
    <div class="id"><span>GPU ${g.idx}</span><b>${fmtGB(g.used||0)} / ${g.total} GB</b></div>
    <div class="gauge" role="img" aria-label="GPU ${g.idx}: ${fmtGB(g.used||0)} of ${g.total} GB in use">${fill}<span class="pct">${pct}</span></div>
    <div class="models">${models}${full&&g.note?`<div class="note">${esc(g.note)}</div>`:''}</div></div>`;
}
function rackHTML(m,full){
  const used=gpuUsedTotal(m);
  const tag = full ? '' : `<button class="rk-tag" type="button" data-id="${m.id}" aria-label="Open ${esc(m.name)} machine sheet">
      <div><h2><span class="lamp"></span>${esc(m.name)}</h2><div class="hw">${esc(m.hw)}</div></div>
      <div><div class="use"><b>${Math.round(used)}</b> / ${m.total} GB</div><div class="open">sheet ↗</div></div></button>`;
  return `<article class="rk" style="--mc:${m.mc}">${tag}<div class="rk-chassis">${m.gpus.map(g=>bayHTML(g,full)).join('')}</div></article>
    ${full?'':`<div class="dim">${m.total} GB across ${m.gpus.length} card${m.gpus.length===1?'':'s'}</div>`}`;
}

function ledgerHTML(m){
  const used=gpuUsedTotal(m);
  return `<section class="lg" style="--mc:${m.mc}">
    <button class="lg-head" type="button" data-id="${m.id}" aria-label="Open ${esc(m.name)} machine sheet">
      <h2><span class="lamp"></span>${esc(m.name)}</h2>
      <div class="hw">${esc(m.hw)}<br>${esc(m.role)}</div>
      <div class="use">${Math.round(used)}<small> / ${m.total} GB in use</small></div>
      <span class="open">machine sheet →</span></button>
    ${ledgerTable(m,false)}</section>`;
}

const LEGEND = `<div class="legend" aria-label="Legend">
  <span><i class="sq s-hot"></i>over 85%</span><span><i class="sq s-warn"></i>40–85%</span><span><i class="sq s-ok"></i>under 40%</span>
  <span><i class="sq s-svc"></i>service</span><span><i class="sq s-held"></i>load-on-demand (not free)</span><span><i class="sq s-idle"></i>free</span></div>`;

/* ---- overview ---- */
function renderOverview(){
  const look=document.documentElement.dataset.look;
  let totVram=0,totUsed=0,totFree=0,totFreeCards=0,totModels=0;
  FLEET.forEach(m=>{ totVram+=m.total; totUsed+=gpuUsedTotal(m); const f=machineFree(m); totFree+=f.freeVram; totFreeCards+=f.freeCards;
    (m.spans||[]).forEach(()=>totModels++); m.gpus.forEach(g=>totModels+=(g.chips?g.chips.length:0)); });
  const cardCount=FLEET.reduce((a,m)=>a+m.gpus.length,0);
  const totals=`<div class="totals">
    <div class="tot"><span class="k">Fleet VRAM</span><b>${totVram}<small> GB</small></b><div class="note">${FLEET.length} GPU boxes · ${cardCount} cards</div></div>
    <div class="tot"><span class="k">Committed</span><b>${Math.round(totUsed)}<small> GB</small></b><div class="note">${totModels} models · weights + context</div></div>
    <div class="tot ${totFreeCards===0?'zero':''}"><span class="k">Deployable free</span><b>${totFreeCards}<small> cards</small></b><div class="note">${totFreeCards===0?'fully committed right now':Math.round(totFree)+' GB on empty cards'}</div></div>
    <div class="tot"><span class="k">Reserved on-demand</span><b>3<small> +1</small></b><div class="note">VibeVoice burst ×3 · 1 card recovering</div></div>
  </div>`;
  const body = look==='ledger' ? FLEET.map(ledgerHTML).join('') : FLEET.map(m=>rackHTML(m,false)).join('');
  document.getElementById('overview').innerHTML = totals + LEGEND + body;
}

/* ---- machine sheet ---- */
function renderDetail(m){
  const look=document.documentElement.dataset.look;
  const used=gpuUsedTotal(m),f=machineFree(m);
  const activeCards=m.gpus.filter(g=>(g.chips&&g.chips.length)||(m.spans||[]).some(s=>s.members.includes(g.idx))).length;
  const specs=m.specs?`<dl class="specs">
      <div><dt>Chassis</dt><dd>${esc(m.specs.chassis)}</dd></div><div><dt>CPU</dt><dd>${esc(m.specs.cpu)}</dd></div>
      <div><dt>Memory</dt><dd>${esc(m.specs.mem)}</dd></div><div><dt>OS</dt><dd>${esc(m.specs.os)}</dd></div></dl>`:'';
  const docs=m.docs&&m.docs.length?`<p class="docs">${m.docs.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)} ↗</a>`).join(' &nbsp;·&nbsp; ')}</p>`:'';
  const proxies=`<table class="plain"><thead><tr><th>Proxy</th><th>Port</th><th>Backend</th><th>Route</th></tr></thead><tbody>
    ${m.proxies.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.port||'—')}</td><td><span class="be be-${esc(p.be)}">${esc(p.be)}</span></td>
      <td>${esc(p.route)}${(p.flags||[]).map(fl=>`<br><span class="flag">${esc(fl)}</span>`).join('')}</td></tr>`).join('')}</tbody></table>`;
  const gpus = look==='ledger' ? ledgerTable(m,true) : rackHTML(m,true);
  document.getElementById('detail').innerHTML=`<article class="sheet" style="--mc:${m.mc}">
    <header class="sheet-head"><div><h2><span class="lamp"></span>${esc(m.name)}</h2><div class="hw">${esc(m.hw)} · ${esc(m.vendor)}</div></div>
      <div><div class="role">${esc(m.role)}</div>
      <div class="tl">VRAM <b>${Math.round(used)} / ${m.total} GB</b> · deployable <b>${f.freeCards} card${f.freeCards===1?'':'s'}</b> · active <b>${activeCards}/${m.gpus.length}</b></div></div></header>
    ${specs}${m.desc?`<p class="desc">${esc(m.desc)}</p>`:''}${docs}
    <section class="block"><p class="section-label">Fronting proxies</p>${proxies}</section>
    <section class="block"><p class="section-label">GPUs · model residency</p>${LEGEND}${gpus}</section></article>`;
}

/* ---- cloud + agents ---- */
function renderCloud(){
  const rows=CLOUD.map(c=>`<tr class="${c.on?'':'inactive'}"><td><b>${esc(c.name)}</b></td><td><span class="${c.on?'on':'off'}">${c.on?'active':'inactive'}</span></td>
    <td>${esc(c.use)}</td><td class="mlist hide-sm">${c.models.map(esc).join(' · ')}</td></tr>`).join('');
  document.getElementById('view-cloud').innerHTML=`<div class="panel"><p class="section-label">Cloud subscriptions — metered fallbacks & specialty models</p>
    <table class="plain"><thead><tr><th>Service</th><th>Status</th><th>Used for</th><th class="hide-sm">Models</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="foot">local self-hosted models are the default; these are the paid/free cloud tiers the proxies fall back to</p>`;
}
function renderAgents(){
  const rows=AGENTS.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="mono">${esc(a.host)}</td><td>${esc(a.role)}</td><td class="mlist">${esc(a.points)}</td></tr>`).join('');
  const subs=KARAKURI.subs.map(s=>`<tr><td><b>${esc(s.role)}</b></td><td>${esc(s.d)}</td></tr>`).join('');
  document.getElementById('view-agents').innerHTML=`<div class="panel"><p class="section-label">Agents — the standing agents (each talks to its own model), plus the Karakuri factory (spawns subagents)</p>
    <table class="plain"><thead><tr><th>Agent</th><th>Host</th><th>Role</th><th>Points at</th></tr></thead><tbody>${rows}</tbody></table></div>
    <section class="panel kara"><h3>${esc(KARAKURI.name)} <small>${esc(KARAKURI.host)} · factory, not a standing agent</small></h3>
      <p>${esc(KARAKURI.tag)}</p><p class="mono" style="font-size:12.5px">note: ${esc(KARAKURI.note)}</p>
      <p class="section-label" style="margin-top:16px">Subagents it spawns (per-role pipeline)</p>
      <table class="plain"><tbody>${subs}</tbody></table></section>`;
}

/* ---- nav ---- */
let curView='compute', curMachine=null;
const TITLES={compute:['Fleet LLM Map','compute · cloud · agents'],cloud:['Fleet LLM Map','cloud subscriptions · metered fallbacks & specialty models'],agents:['Fleet LLM Map','agents · who points at what']};
function setCrumb(t,s){ document.getElementById('crumbTitle').textContent=t; document.getElementById('crumbSub').textContent=s; }
function showMachine(id){
  const m=FLEET.find(x=>x.id===id); if(!m)return;
  curMachine=id; renderDetail(m);
  document.getElementById('overview').classList.add('hide');
  document.getElementById('detail').classList.remove('hide');
  document.getElementById('backbtn').classList.remove('hide');
  setCrumb(TITLES.compute[0],'compute › '+m.name);
  window.scrollTo({top:0});
}
function backToOverview(){
  curMachine=null;
  document.getElementById('overview').classList.remove('hide');
  document.getElementById('detail').classList.add('hide');
  document.getElementById('backbtn').classList.add('hide');
  setCrumb(...TITLES.compute);
}
function switchView(v){
  curView=v;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));
  ['compute','cloud','agents'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hide',x!==v));
  document.getElementById('backbtn').classList.add('hide');
  if(v==='compute') backToOverview(); else setCrumb(...TITLES[v]);
  window.scrollTo({top:0});
}
function setLook(l){
  document.documentElement.dataset.look=l;
  document.querySelectorAll('.look button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.look===l)));
  try{localStorage.setItem('fleetmap-look',l)}catch(e){}
  renderOverview();
  if(curMachine){ const m=FLEET.find(x=>x.id===curMachine); if(m) renderDetail(m); }
}
setLook(document.documentElement.dataset.look==='ledger'?'ledger':'rack');
renderCloud(); renderAgents();
document.getElementById('overview').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)showMachine(c.dataset.id);});
document.getElementById('backbtn').addEventListener('click',backToOverview);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
document.querySelectorAll('.look button').forEach(b=>b.addEventListener('click',()=>setLook(b.dataset.look)));
</script>
</body></html>
